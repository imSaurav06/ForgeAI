networks:
  forge_ai_network:
    driver: bridge

volumes:
  mongo_data:
  qdrant_data:

services:
  # Datastores & Runtime Engines
  mongodb:
    image: mongo:7.0
    container_name: forge_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - forge_ai_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: forge_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - forge_ai_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Core Backend Microservices
  repository:
    build: .
    container_name: forge_repository
    command: python -m uvicorn services.repository.app.main:app --host 0.0.0.0 --port 8003
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=repository-service
      - MONGODB_URI=mongodb://mongodb:27017
      - LOG_LEVEL=INFO
    volumes:
      - C:/:/host_c
      - E:/:/host_e
      - F:/:/host_f
      - E:/ForgeAII:/app/workspace
      - E:/ForgeAII/services:/app/services
      - E:/ForgeAII/shared:/app/shared
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - forge_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  retrieval:
    build: .
    container_name: forge_retrieval
    command: python -m uvicorn services.retrieval.app.main:app --host 0.0.0.0 --port 8004
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=retrieval-service
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REPOSITORY_SERVICE_URL=http://repository:8003
    volumes:
      - C:/:/host_c
      - E:/:/host_e
      - F:/:/host_f
      - E:/ForgeAII:/app/workspace
      - E:/ForgeAII/services:/app/services
      - E:/ForgeAII/shared:/app/shared
    depends_on:
      qdrant:
        condition: service_healthy
      repository:
        condition: service_healthy
    networks:
      - forge_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  llm:
    build: .
    container_name: forge_llm
    command: python -m uvicorn services.llm.app.main:app --host 0.0.0.0 --port 8002
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=llm-service
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - E:/ForgeAII/services:/app/services
      - E:/ForgeAII/shared:/app/shared
    networks:
      - forge_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  tools:
    build: .
    container_name: forge_tools
    command: python -m uvicorn services.tools.app.main:app --host 0.0.0.0 --port 8005
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - SERVICE_NAME=tool-service
      - WORKSPACE_ROOT=/app/workspace
      - REPOSITORY_SERVICE_URL=http://repository:8003
      - MONGODB_URI=mongodb://mongodb:27017
    volumes:
      - C:/:/host_c
      - E:/:/host_e
      - F:/:/host_f
      - E:/ForgeAII:/app/workspace
      - E:/ForgeAII/services:/app/services
      - E:/ForgeAII/shared:/app/shared
    networks:
      - forge_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  git:
    build: .
    container_name: forge_git
    command: python -m uvicorn services.git.app.main:app --host 0.0.0.0 --port 8006
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - SERVICE_NAME=git-service
      - WORKSPACE_ROOT=/app/workspace
    volumes:
      - C:/:/host_c
      - E:/:/host_e
      - F:/:/host_f
      - E:/ForgeAII:/app/workspace
      - E:/ForgeAII/services:/app/services
      - E:/ForgeAII/shared:/app/shared
    networks:
      - forge_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  evaluation:
    build: .
    container_name: forge_evaluation
    command: python -m uvicorn services.evaluation.app.main:app --host 0.0.0.0 --port 8007
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      - SERVICE_NAME=evaluation-service
      - MONGODB_URI=mongodb://mongodb:27017
      - AGENT_SERVICE_URL=http://agent:8001
    volumes:
      - E:/ForgeAII/services:/app/services
      - E:/ForgeAII/shared:/app/shared
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - forge_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Orchestrator & Entrypoint Gateway
  agent:
    build: .
    container_name: forge_agent
    command: python -m uvicorn services.agent.app.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=agent-service
      - MONGODB_URI=mongodb://mongodb:27017
      - REPOSITORY_SERVICE_URL=http://repository:8003
      - RETRIEVAL_SERVICE_URL=http://retrieval:8004
      - LLM_SERVICE_URL=http://llm:8002
      - TOOL_SERVICE_URL=http://tools:8005
      - GIT_SERVICE_URL=http://git:8006
    volumes:
      - C:/:/host_c
      - E:/:/host_e
      - F:/:/host_f
      - E:/ForgeAII:/app/workspace
      - E:/ForgeAII/services:/app/services
      - E:/ForgeAII/shared:/app/shared
    depends_on:
      mongodb:
        condition: service_healthy
      repository:
        condition: service_healthy
      retrieval:
        condition: service_healthy
      llm:
        condition: service_healthy
      tools:
        condition: service_healthy
      git:
        condition: service_healthy
    networks:
      - forge_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    container_name: forge_gateway
    command: python -m uvicorn services.gateway.app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=api-gateway
      - MONGODB_URI=mongodb://mongodb:27017
      - AGENT_URL=http://agent:8001
      - LLM_URL=http://llm:8002
      - REPOSITORY_URL=http://repository:8003
      - RETRIEVAL_URL=http://retrieval:8004
      - TOOLS_URL=http://tools:8005
      - GIT_URL=http://git:8006
      - EVALUATION_URL=http://evaluation:8007
    volumes:
      - E:/ForgeAII/services:/app/services
      - E:/ForgeAII/shared:/app/shared
      - E:/ForgeAII:/app/workspace
    depends_on:
      agent:
        condition: service_healthy
      evaluation:
        condition: service_healthy
    networks:
      - forge_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

